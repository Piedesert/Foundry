id: skill-design
version: 0.2.0
name: Skill Design
description: Diagnoses agent capability gaps and plans narrow, reusable, provider-neutral skill improvements.
purpose: Recommend reuse, composition, revision, or a new skill with explicit scope, portability, failure behavior, and evaluation coverage.
applicability:
  - Cross-provider agent design
  - Developer productivity
  - Creative production workflows
  - Personal automation
required_inputs:
  capability:
    type: string
    description: Repeatable capability to formalize.
    required: true
  existing_skills:
    type: string
    description: Existing skill catalog to inspect for overlap.
    required: false
  constraints:
    type: array
    description: Safety, privacy, tool, and portability constraints.
    required: false
  target_agent:
    type: string
    description: Existing agent to inspect when proposing an improvement.
    required: false
  observed_gap:
    type: string
    description: Repeated shortcoming or evaluation failure the proposal should address.
    required: false
  evidence:
    type: array
    description: Examples or evaluation findings supporting the observed gap.
    required: false
procedure:
  - step: 1
    action: Inspect the target
    details: For an agent-improvement request, inspect its manifest, instructions, linked skills, and evaluations; ask for missing target or evidence.
  - step: 2
    action: Confirm the gap is reusable
    details: Distinguish a repeated cross-agent procedure from one-off workflow logic or missing integration behavior.
  - step: 3
    action: Compare improvement options
    details: Choose reuse, composition, revision, or creation and explain why alternatives do not fit.
  - step: 4
    action: Map affected agents
    details: Identify candidate consumers and any required instruction, contract, permission, or evaluation changes.
  - step: 5
    action: Define the candidate contract
    details: Specify inputs, output, bounded procedure, constraints, stop conditions, and failure behavior.
  - step: 6
    action: Review portability and evaluations
    details: Mark unverified runtime capabilities and propose tests for normal use, missing input, ambiguity, tool failure, overlap, and safety.
  - step: 7
    action: Return a chat proposal
    details: Present the decision and plan; include a candidate manifest only when requested and never write repository files.
constraints:
  - Do not duplicate an existing skill without documenting the distinct boundary.
  - Do not put secrets, credentials, or provider-specific prompt delimiters in a canonical skill.
  - Do not assume memory, browsing, code execution, or structured output without declaring the dependency.
  - Keep the skill independently understandable and composable.
  - Do not propose a new skill when reuse, composition, or a narrow revision is sufficient.
  - Do not write to the canonical repository, generated adapters, or hosted platforms.
expected_output:
  format: structured_json
  description: An improvement decision, affected-agent map, portability review, evaluation plan, open assumptions, and next actions; optional candidate manifest is chat-only.
failure_behavior:
  on_missing_input: Identify the smallest missing capability definition needed to proceed.
  on_ambiguity: Present realistic reuse, composition, revision, and creation options or ask one focused question when the choice is material.
  on_tool_failure: Return a plan with unverified overlap or portability areas explicitly marked; do not claim repository validation.
