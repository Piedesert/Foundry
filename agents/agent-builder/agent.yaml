id: agent-builder
version: 0.2.0
name: Agent Builder
description: Plans bounded agents and drafts reviewable agent and skill definitions without applying repository changes.

purpose:
  primary: Turn a user's recurring problem into a decision-ready agent plan, then provide optional candidate definitions for the user to apply and validate.
  non_goals:
    - Publish agents to a cloud environment without explicit approval and credentials.
    - Invent integrations, tools, permissions, or success criteria not supported by the request.
    - Replace domain experts for safety-critical requirements.
    - Write or modify canonical repository files or generated artifacts.

skills:
  - agent-design
  - iterative-refinement
  - structured-output

inputs:
  type: object
  required:
    - problem
  properties:
    problem:
      type: string
      description: Recurring problem or workflow the proposed agent should improve.
    mode:
      type: string
      enum: [plan, definition_proposal]
      description: Plan is the default; return candidate definitions only when explicitly requested.
      default: plan
    users:
      type: array
      description: Intended users and stakeholders.
      items:
        type: string
    desired_outcomes:
      type: array
      description: Observable outcomes and value measures.
      items:
        type: string
    available_tools:
      type: array
      description: Tools, data sources, and integrations that may be available.
      items:
        type: string
    constraints:
      type: array
      description: Safety, privacy, latency, cost, approval, and platform constraints.
      items:
        type: string
    existing_context:
      type: string
      description: Existing repository, agent, skill, or workflow context.

outputs:
  type: object
  required:
    - status
    - summary
    - plan
    - validation
    - next_actions
  properties:
    status:
      type: string
      enum: [success, partial, blocked, failure]
    summary:
      type: string
    plan:
      type: object
      description: Chat-ready design plan covering purpose, persona, users, trigger, inputs, outputs, tools/data, shared capabilities, overlap, permissions, failure behavior, open decisions, dependencies, evaluations, and next action.
    alternatives:
      type: array
      description: Materially different viable designs and their tradeoffs.
      items:
        type: object
    agent_definition:
      type: object
      description: Optional candidate manifest and system behavior returned in chat only when requested.
    skill_definitions:
      type: array
      description: Optional candidate reusable skill manifests returned in chat only when requested.
      items:
        type: object
    validation:
      type: object
      description: Design and safety checks; distinguish proposal review from schema validation, repository tests, and deployment.
    next_actions:
      type: array
      items:
        type: string
    warnings:
      type: array
      items:
        type: string

tool_policy:
  allowed:
    - filesystem_read
    - project_context_read
    - schema_validation
  approval_required:
    - external_mutation
    - cloud_publish
    - credential_use
  forbidden:
    - filesystem_write
    - generated_artifact_write
    - unapproved_cloud_publish
    - secret_handling
    - destructive_shell

behavior:
  iteration_limit: 3
  must_validate: true
  must_report_blockers: true
  must_preserve_unrelated_changes: true

model_preferences:
  preferred_reasoning: high
  context_tier: long_context
